<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Yu-Gi-Oh Collection</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            color: white;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .login-header p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1rem;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            color: white;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .form-group input {
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.9);
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            background: white;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.3);
        }

        .login-btn {
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: white;
            color: #667eea;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .error-message {
            background: rgba(234, 67, 53, 0.9);
            color: white;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            display: none;
            animation: shake 0.5s;
        }

        .error-message.show {
            display: block;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .card-icon {
            font-size: 3rem;
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="card-icon">🎴</div>
        <div class="login-header">
            <h1>Yu-Gi-Oh Collection</h1>
            <p>Enter password to access</p>
        </div>

        <form class="login-form" id="loginForm">
            <div id="errorMessage" class="error-message">
                Incorrect password. Please try again.
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    autocomplete="off"
                    required
                >
            </div>

            <button type="submit" class="login-btn">
                Access Collection
            </button>
        </form>
    </div>

    <script>
        const CORRECT_PASSWORD = 'JON';
        const SESSION_KEY = 'yugioh_authenticated';
        const SESSION_DURATION = 24 * 60 * 60 * 1000; // 24 hours

        // Check if already authenticated
        const checkAuth = () => {
            const authData = localStorage.getItem(SESSION_KEY);
            if (authData) {
                const { timestamp } = JSON.parse(authData);
                const now = Date.now();
                if (now - timestamp < SESSION_DURATION) {
                    // Still valid, redirect to main page
                    window.location.href = 'index.html';
                    return true;
                } else {
                    // Expired
                    localStorage.removeItem(SESSION_KEY);
                }
            }
            return false;
        };

        // Check on page load
        checkAuth();

        // Handle form submission
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();

            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');

            if (password === CORRECT_PASSWORD) {
                // Store authentication
                localStorage.setItem(SESSION_KEY, JSON.stringify({
                    authenticated: true,
                    timestamp: Date.now()
                }));

                // Redirect to main page
                window.location.href = 'index.html';
            } else {
                // Show error
                errorMessage.classList.add('show');
                document.getElementById('password').value = '';
                document.getElementById('password').focus();

                // Hide error after 3 seconds
                setTimeout(() => {
                    errorMessage.classList.remove('show');
                }, 3000);
            }
        });

        // Focus password field on load
        document.getElementById('password').focus();
    </script>
</body>
</html>
