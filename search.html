<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Search - Yu-Gi-Oh Collection</title>
    <link rel="stylesheet" href="styles.css">
    <script src="auth.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <div class="nav-links">
                <a href="index.html" class="nav-btn">← Back to Decks</a>
                <a href="inventory.html" class="nav-btn">📦 Card Inventory</a>
                <a href="shopping-list.html" class="nav-btn">🛒 Shopping List</a>
                <a href="stats.html" class="nav-btn">📊 Stats</a>
            </div>
            <h1>🔍 Global Card Search</h1>
            <p class="subtitle">Search for any card across all 56 decks</p>
        </header>

        <div class="search-controls">
            <div class="search-bar-large">
                <input type="text" id="globalSearch" placeholder="Search for a card name..." autocomplete="off" autofocus>
                <button id="clearSearch" style="display: none;">✕</button>
            </div>
        </div>

        <div id="searchResults">
            <p style="color: rgba(255,255,255,0.6); text-align: center; padding: 60px 20px; font-size: 1.2rem;">
                Enter a card name to search across all decks
            </p>
        </div>
    </div>

    <script src="decks.js"></script>
    <script src="owned-cards-data.js"></script>
    <script src="search.js"></script>
</body>
</html>
